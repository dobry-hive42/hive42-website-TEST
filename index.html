<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hive42 Web Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* Layout: one-page site with hash-routed subpages; experience = sticky filter bar above results */
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --ink:#262628; --muted:#62636A; --line:#E0DFDA;
  --gold:#D3AF5E; --gold-ink:#8A6A1E; --gold-soft:#F6EEDC; --on-gold:#1E1709;
  --logo-ink:#414142; --chip:#EFEEEA; --bar:#CFCDC6; --bar-child:#E7DCC2;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141416; --surface:#1C1C1F; --ink:#EDECE8; --muted:#A3A2A8; --line:#313136;
  --gold:#D9B868; --gold-ink:#E2C27A; --gold-soft:#2E2818; --on-gold:#1E1709;
  --logo-ink:#EDECE8; --chip:#26262A; --bar:#46464D; --bar-child:#4A4230; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141416; --surface:#1C1C1F; --ink:#EDECE8; --muted:#A3A2A8; --line:#313136;
  --gold:#D9B868; --gold-ink:#E2C27A; --gold-soft:#2E2818; --on-gold:#1E1709;
  --logo-ink:#EDECE8; --chip:#26262A; --bar:#46464D; --bar-child:#4A4230; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html:not(.internal) .int-only{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--gold-ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.eyebrow{font:500 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
.mk-gold{fill:var(--gold)} .wm-ink{fill:var(--logo-ink)}

.proto{background:var(--gold-soft);border-bottom:1px solid var(--line);font-size:13px}
.int-tgl{border:1px solid var(--gold-ink);background:transparent;color:var(--gold-ink);border-radius:999px;padding:2px 10px;font-size:12px}
html.internal .int-tgl{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.proto .wrap{padding-block:8px;display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:space-between}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.logo{display:flex;align-items:center;text-decoration:none}
.logo svg{height:34px;width:auto}
nav.main{display:flex;gap:18px;margin-left:auto;font-size:14px}
nav.main a{color:var(--muted);text-decoration:none}
nav.main a:hover{color:var(--ink)}
nav.main a.active{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--gold);padding-bottom:4px}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;font:500 12px/1 var(--f-mono)}
.lang button{background:none;border:0;padding:7px 9px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--chip);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:var(--on-gold);border:0;border-radius:8px;padding:10px 16px;font-weight:600;text-decoration:none}
.btn.ghost{background:transparent;color:var(--gold-ink);border:1.5px solid var(--gold)}
.btn.ghost:hover{background:var(--gold-soft)}
.btn:hover{filter:brightness(1.05)}
@media (max-width:760px){nav.main{display:none}.lang{margin-left:auto}}

.hero .wrap{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;padding-block:48px 40px}
.hero h1{font-size:clamp(28px,4.4vw,44px);line-height:1.1;max-width:22ch}
.hero p{color:var(--muted);max-width:60ch;margin:16px 0 22px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.hero img{width:180px;height:180px;border-radius:50%;object-fit:cover;border:4px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.who{font:500 13px/1.4 var(--f-mono);color:var(--muted);margin-bottom:14px}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin-top:26px}
.facts div{font-size:13px;color:var(--muted)}
.facts b{display:block;font:700 22px/1.1 var(--f-display);color:var(--ink)}
@media (max-width:700px){.hero .wrap{grid-template-columns:1fr}.hero img{width:120px;height:120px;order:-1}}
/* default layout: photo centred against the headline (V0, V1) */
@media (min-width:701px){html:not(.lv2):not(.lv3):not(.lv4) .hero .wrap>div{display:contents}
 html:not(.lv2):not(.lv3):not(.lv4) .hero .wrap>div>*{grid-column:1}
 html:not(.lv2):not(.lv3):not(.lv4) .hero .wrap{row-gap:0;align-items:start}
 html:not(.lv2):not(.lv3):not(.lv4) .hero h1{grid-row:2}
 html:not(.lv2):not(.lv3):not(.lv4) .hero img{grid-column:2;grid-row:2;align-self:center;transform:translateY(var(--h1shift,0px))}}

section{padding-block:40px}
section[id]{scroll-margin-top:60px}
section > .wrap > header{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
section h2{font-size:clamp(22px,3vw,30px)}

.svc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.svc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.svc-grid{grid-template-columns:1fr}}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.svc h3{font-size:18px}
.svc p{margin:0;color:var(--muted);font-size:14px;flex:1}
.svc .count{font:500 12px/1 var(--f-mono);color:var(--muted)}
.svc .links{display:flex;flex-direction:column;gap:6px;font-size:14px}
.svc .links a{font-weight:600}

/* experience */
#experience{background:var(--surface);border-block:1px solid var(--line)}
.fbar-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);z-index:10;background:var(--surface);padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.fbtn[aria-expanded="true"]{border-color:var(--gold);background:var(--gold-soft)}
.fbtn .sel{font:500 12px/1 var(--f-mono);color:var(--gold-ink)}
.fbtn .car{font-size:10px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.seg button{background:none;border:0;padding:7px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--ink);font-weight:600}
.panel{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:14px;max-height:min(52vh,420px);overflow:auto}
.panel .opts{columns:210px;column-gap:16px}
.panel .opts .opt{break-inside:avoid}
.opt{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 2px;cursor:pointer}
.opt input{accent-color:var(--gold);width:16px;height:16px}
.opt.dis{opacity:.4;cursor:default}
.opt .n{color:var(--muted);font:400 12px/1 var(--f-mono)}
.panel .pfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--gold-ink);font-size:13px;font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.linkbtn:hover{text-decoration-thickness:2px}
.status{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;font-size:14px}
.status .res{font-weight:600}
.achip{border:1.5px solid var(--gold);background:var(--gold-soft);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer}
.achip:hover{background:var(--gold);color:var(--on-gold)}

.cards{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0;scroll-margin-top:180px}
.card .head{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px}
.card .brand{font:700 17px/1.25 var(--f-display)}
.card .sub,.card .role{color:var(--muted);font-size:14px}
.card .yrs{font:500 13px/1.6 var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.card .sum{grid-column:1/-1;margin-top:4px}
.card .meta{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 11px/1 var(--f-mono);padding:4px 7px;border-radius:5px;background:var(--chip);color:var(--muted)}
.tag.svc-t{background:var(--chip);color:var(--ink)}
.tag.h42{background:var(--chip)}
.tag.cs{background:var(--chip);color:var(--ink)}
.tag.cs::before{content:"★ ";color:var(--gold-ink)}
.tag{cursor:default;user-select:none}
.toggle{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--gold-ink);border-radius:999px;padding:4px 10px 4px 12px;color:var(--gold-ink);font-size:13px;font-weight:600;white-space:nowrap;margin-left:auto}
.toggle:hover{background:var(--gold-soft)}
.toggle svg{width:14px;height:14px;transition:transform .2s}
.toggle[aria-expanded="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.tag.match{background:var(--ink);color:var(--surface)}
.sitemap{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px 24px;margin:14px 0 22px}
.sitemap .grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.sitemap .grp b{font:500 12px/1.4 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink)}
.sitemap button{all:unset;cursor:pointer;color:var(--muted)}.sitemap button:hover{color:var(--ink)}
.foot-line{display:flex;gap:6px 18px;flex-wrap:wrap}
.foot-line a{color:var(--muted)}.foot-line a:hover{color:var(--ink)}
.foot-line button{all:unset;cursor:pointer;color:var(--muted);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}.foot-line button:hover{color:var(--ink)}
.ck{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-bottom,0px))}
.ck .box{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.18);padding:16px 18px;display:grid;gap:10px}
.ck h2{font-size:17px}
.ck p{margin:0;font-size:14px;color:var(--muted)}
.ck .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ck .acts .btn{padding:8px 14px}
.ck .acts .sp{flex:1}
.ck .cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ck .cat small{grid-column:1;color:var(--muted);font-size:13px}
.ck .cat input{grid-row:1/3;grid-column:2;align-self:center;width:18px;height:18px;accent-color:var(--gold)}
.ck .cat .on{grid-row:1/3;grid-column:2;align-self:center;font:500 11px/1 var(--f-mono);color:var(--muted)}
.ck .proto-n{font:400 12px/1.4 var(--f-mono);color:var(--gold-ink)}
.formpriv{font-size:13px;color:var(--muted);margin:0}
.legal h2{font-size:20px;margin:26px 0 8px}.legal p{max-width:72ch;margin:0}
.legal .note{background:var(--gold-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin:16px 0 0;max-width:72ch}
.fv{display:flex;flex-direction:column;align-items:center;gap:6px}
.sitemap a{color:var(--muted)}.sitemap a:hover{color:var(--ink)}
.svc h3 a{color:inherit;text-decoration:none}.svc h3 a:hover{color:var(--gold-ink)}
.detail{padding:0 16px 16px;border-top:1px dashed var(--line);display:grid;gap:10px}
.detail p{margin:12px 0 0;max-width:72ch}
.detail dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:13px}
.detail dt{color:var(--muted)} .detail dd{margin:0}
.card.flash{box-shadow:0 0 0 2px var(--gold)}
.empty{padding:28px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}

/* timeline */
.tl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.tl{min-width:780px;padding:12px 16px 16px}
.tl-axis,.tl-row{display:grid;grid-template-columns:230px 1fr;gap:12px;align-items:center}
.tl-axis .yrs{position:relative;height:18px;font:400 11px/1 var(--f-mono);color:var(--muted)}
.tl-axis .yrs span{position:absolute;transform:translateX(-50%)}
.tl-row{padding-block:5px;border-top:1px solid var(--line)}
.tl-row.child{border-top:0;padding-block:2px}
.tl-row .lbl{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-row.child .lbl{padding-left:16px;color:var(--muted);font-size:12px}
.tl-row.parent .lbl b{font-weight:700}
.tl-row .track{position:relative;height:16px}
.tl-row.child .track{height:10px}
.tl-row .bar{position:absolute;top:2px;height:12px;border-radius:4px;background:var(--bar);border:0;padding:0}
.tl-row.child .bar{height:8px;top:1px;background:var(--bar-child)}
.tl-row.parent .bar{background:var(--gold)}
.tl.filtering .bar{opacity:.12}
.tl.filtering .lbl{opacity:.4}
.tl.filtering .tl-row.hit .lbl{opacity:1;color:var(--ink);font-weight:600}
.tl.filtering .tl-row.hit .bar{opacity:1;background:var(--gold-ink);box-shadow:0 0 0 2px var(--gold-soft)}
.tl.filtering .tl-row.parent.hit .lbl{opacity:1}
.tl.filtering .tl-row.parent.hit .bar{opacity:.6}
.tl-row .band{position:absolute;top:-4px;bottom:-4px;background:var(--gold-soft);border-radius:4px}
.tl-note{font-size:12px;color:var(--muted);margin-top:8px}

.cs-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.cs-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.cs-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.cs-grid{grid-template-columns:1fr}}
.csc{text-decoration:none;color:inherit;border-top:3px solid var(--gold);background:var(--surface);border-radius:0 0 12px 12px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:0 0 0 1px var(--line)}
.csc .big{font:700 24px/1.1 var(--f-display)}
.csc .t{font-weight:600}
.csc .d{color:var(--muted);font-size:14px}
.csc .o{color:var(--gold-ink);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:32px}
@media (max-width:800px){.contact{grid-template-columns:1fr}}
form{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:110px;resize:vertical}
.formnote{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--gold-soft)}
.subj{font:400 12px/1.4 var(--f-mono);color:var(--muted)}

/* subpages */
.page .wrap{padding-block:32px 48px}
.back{display:block;width:fit-content;margin-bottom:18px;font-size:14px;font-weight:600}
.page h1{font-size:clamp(28px,4vw,40px);margin:6px 0 10px}
.page .lead{font-size:17px;color:var(--muted);max-width:62ch;margin:0 0 24px}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.block h3{font-size:18px;margin:22px 0 6px}
.block p{margin:0;max-width:66ch}
.block ul{margin:6px 0 0;padding-left:20px}
.side{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px}
.side .k{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.side .v{font-size:14px}
.kpis{display:flex;flex-wrap:wrap;gap:20px;margin:6px 0 24px}
.kpis div{font-size:13px;color:var(--muted)}
.kpis b{display:block;font:700 26px/1.1 var(--f-display);color:var(--ink)}
.rel{display:grid;gap:8px;margin-top:10px}
.rel a{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:inherit}
.rel a span:last-child{font:500 12px/1.6 var(--f-mono);color:var(--muted);white-space:nowrap}

/* logo page */
/* ===== Layout variants V1–V4 (homepage only, internal switcher) ===== */
.lvsw{display:flex;gap:4px;flex-wrap:wrap}
.lvsw button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 10px;font-size:13px}
.lvsw button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);font-weight:600}
/* V1 tmavý úvod + služby jako číslované řádky */
html.lv1 .hero{background:#1F1F21;color:#EDECE8}
html.lv1 .hero h1{color:#F4F2EC}
html.lv1 .hero p,html.lv1 .facts div{color:#B9B8BE}
html.lv1 .who,html.lv1 .facts b{color:#D9B868}
html.lv1 .hero .btn.ghost{color:#EDECE8;border-color:#46464D}
html.lv1 .hero img{width:240px;height:240px;border-radius:24px;border:0;box-shadow:0 0 0 4px #D3AF5E}
html.lv1 .svc-grid{grid-template-columns:1fr;gap:0;counter-reset:sv}
html.lv1 .svc{display:grid;grid-template-columns:72px minmax(0,1fr) minmax(0,1.6fr) auto;gap:8px 24px;align-items:baseline;background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:22px 0}
html.lv1 .svc::before{counter-increment:sv;content:"0" counter(sv);font:700 30px/1 var(--f-display);color:var(--gold-ink)}
html.lv1 .svc .count{display:none}
html.lv1 .svc h3{font-size:22px}
@media (max-width:760px){html.lv1 .svc{grid-template-columns:48px minmax(0,1fr)}html.lv1 .svc p,html.lv1 .svc .links{grid-column:2}}
/* V2 na střed, služby 2×2, studie jako seznam */
html.lv2 .hero .wrap{grid-template-columns:1fr;justify-items:center;text-align:center;padding-block:64px 48px}
html.lv2 .hero img{order:-1;width:132px;height:132px}
html.lv2 .hero h1{font-size:clamp(30px,5.4vw,58px);max-width:20ch;margin-inline:auto}
html.lv2 .hero p{margin-inline:auto}
html.lv2 .hero .ctas,html.lv2 .facts{justify-content:center}
html.lv2 .facts div+div{border-left:1px solid var(--line);padding-left:28px}
html.lv2 section > .wrap > header{align-items:center;text-align:center}
html.lv2 .svc-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
html.lv2 .svc{background:var(--gold-soft);border:0;padding:28px}
html.lv2 .svc h3{font-size:24px}
html.lv2 .cs-grid{grid-template-columns:1fr;gap:0}

/* V3 velká fotka, tmavé karty služeb, hlavní studie přes celou šířku */

html.lv3 .svc{background:#1F1F21;color:#EDECE8;border:0;padding:22px}

@media (max-width:760px){html.lv3 .hero .wrap{grid-template-columns:1fr}html.lv3 .hero img{order:-1;max-width:260px;justify-self:start}html.lv3 .cs-grid{grid-template-columns:1fr}}

 {id:"Z09",p:"hive42",brand:"PetCenter.cz",sub:"& Pytelgranuli.cz",brands:["PetCenter.cz","Pytelgranuli.cz"],roles:["po"],svc:["pmpo","sm"],ind:["ecom","retail"],env:"sme",s:2019,e:2019,
  role:["E-commerce manažer, Product Owner","E-commerce Manager, Product Owner","E-Commerce-Manager, Product Owner"],
  sum:["Řízení několika e-shopů ve více zemích, napojených na kamennou síť.","Management of several e-shops in multiple countries, linked to a retail network.","Führung mehrerer E-Shops in mehreren Ländern, verbunden mit einem Filialnetz."],
  det:["Vedení a koučink týmu online marketingu, SEO a zákaznické podpory; CRO a analytika; P&L a plán expanze; příprava migrace z Magenta na Shoptet včetně celého nákupního procesu.","Led and coached the online marketing, SEO and customer support team; CRO and analytics; P&L and expansion planning; planned the migration from Magento to Shoptet including the full purchase flow.","Führung und Coaching des Teams für Online-Marketing, SEO und Kundensupport; CRO und Analytics; P&L und Expansionsplanung; Planung der Migration von Magento zu Shoptet inklusive des gesamten Kaufprozesses."]},
 {id:"Z10",brand:"The Adecco Group",brands:["The Adecco Group","Amazon"],roles:["dm","sm","ac"],svc:["dpm","pmpo","at","sm"],ind:["hr","ai"],env:"corp",s:2020,e:2021,cs:"case-adecco",
  role:["Delivery Manager, Scrum Master, kouč","Delivery Manager, Scrum Master, Coach","Delivery Manager, Scrum Master, Coach"],
  sum:["Převzal jsem zaseknutý AI chatbot pro nábor, spustil MVP s Amazonem jako klientem a rozšířil ho do 5+ zemí.","Took over a stalled AI recruiting chatbot, launched an MVP with Amazon as client and rolled it out to 5+ countries.","Übernahme eines festgefahrenen KI-Recruiting-Chatbots, Start eines MVP mit Amazon als Kunde und Rollout in über 5 Länder."],
  det:["Předání od externího dodavatele novému internímu týmu; nový backlog a sprint planning zdvojnásobily velocity i kvalitu do 2 měsíců. Provedl jsem produkt právními, bezpečnostními a compliance komisemi a zkrátil první fázi náboru ze 2 měsíců na 2 týdny. DevOps proces v Azure DevOps (.NET, C#, React). Nominace do top 10 projektů roku Adecco Group a postup do top 3.","Handover from an external supplier to a new internal team; a rebuilt backlog and sprint planning doubled velocity and quality within 2 months. Led the product through legal, security and compliance boards and cut the first recruitment phase from 2 months to 2 weeks. DevOps process on Azure DevOps (.NET, C#, React). Nominated to the Adecco Group top 10 projects of the year, then advanced to the top 3.","Übergabe von einem externen Dienstleister an ein neues internes Team; neues Backlog und Sprint Planning verdoppelten Velocity und Qualität innerhalb von 2 Monaten. Produkt durch Rechts-, Sicherheits- und Compliance-Gremien geführt und die erste Recruiting-Phase von 2 Monaten auf 2 Wochen verkürzt. DevOps-Prozess in Azure DevOps (.NET, C#, React). Nominiert für die Top 10 Projekte des Jahres der Adecco Group, danach unter den Top 3."]},
 {id:"Z11",brand:"ŠKODA AUTO DigiLab",sub:"Škoda X · HoppyGo",brands:["ŠKODA AUTO","HoppyGo","BeRider","Volkswagen Group"],roles:["pm","po","coo"],svc:["pmpo","at","sm"],ind:["auto","mobility","market"],env:"cstart",s:2017,e:2019,cs:"case-hoppygo",
  role:["Senior PM a spoluzakladatel, později COO","Senior PM & Co-Founder, later COO","Senior PM und Mitgründer, später COO"],
  sum:["DigiLab byl inovační lab ŠKODA AUTO (koncern Volkswagen), pod kterým vznikly startupy HoppyGo a BeRider. HoppyGo jsem dovedl od nápadu k jedničce P2P car sharingu v ČR a lab pomohl vybudovat ze 6 na 30+ lidí.","DigiLab was ŠKODA AUTO's innovation lab (Volkswagen Group) and the home of the startups HoppyGo and BeRider. I took HoppyGo from idea to the #1 P2P car sharing in the Czech Republic and helped grow the lab from 6 to 30+ people.","Das DigiLab war das Innovationslabor von ŠKODA AUTO (Volkswagen-Konzern), aus dem die Startups HoppyGo und BeRider hervorgingen. HoppyGo von der Idee zur Nummer 1 im tschechischen P2P-Carsharing geführt und das Labor von 6 auf über 30 Personen mit aufgebaut."],
  det:["PM a PO s vlastním Scrum týmem: koncept, PoC, MVP, business case a schválení investice boardem; později člen dozorčí rady HoppyGo. HoppyGo se umístilo v top 5 nejrychleji rostoucích firem Deloitte Technology Fast 50 CE 2022 (růst 2099 %). Jako COO: zavedení agile (Lean, Kanban, Scrum), strategie vývoje, IT migrace s auditem ISO 27001, nábor interních týmů. První AI projekt ve ŠKODA AUTO (Sound Analyzer).","PM and PO with a dedicated Scrum team: concept, PoC, MVP, business case and board approval; later a member of the HoppyGo Supervisory Board. HoppyGo was named among the top 5 fastest growing companies in Deloitte Technology Fast 50 CE 2022 (2099 % growth). As COO: introduced agile (Lean, Kanban, Scrum), development strategy, IT migration with an ISO 27001 audit and hiring of internal teams. First AI project at ŠKODA AUTO (Sound Analyzer).","PM und PO mit eigenem Scrum-Team: Konzept, PoC, MVP, Business Case und Freigabe durch den Vorstand; später Mitglied im Aufsichtsrat von HoppyGo. HoppyGo zählte im Deloitte Technology Fast 50 CE 2022 zu den Top 5 der am schnellsten wachsenden Unternehmen (2099 % Wachstum). Als COO: Einführung von Agile (Lean, Kanban, Scrum), Entwicklungsstrategie, IT-Migration mit ISO-27001-Audit und Aufbau interner Teams. Erstes KI-Projekt bei ŠKODA AUTO (Sound Analyzer)."]},
 {id:"Z12",brand:"eBay Enterprise",sub:"Zeta Interactive",brands:["eBay","Zeta Interactive"],roles:["ops"],svc:["dpm","at"],ind:["mauto","ecom"],env:"corp",s:2015,e:2016,cs:"case-ebay",
  role:["Operations Manager, vedoucí pražského centra","Operations Manager, Head of Prague Center","Operations Manager, Leiter des Prager Zentrums"],
  sum:["Pomáhal jsem škálovat pražské delivery centrum a rozšířit kampaňovou delivery pro eBay z EU na globální pokrytí.","Helped scale the Prague delivery centre and extend eBay's campaign delivery from EU to global coverage.","Mithilfe beim Skalieren des Prager Delivery-Zentrums und bei der Ausweitung der Kampagnen-Delivery für eBay von der EU auf globale Abdeckung."],
  det:["Vedení týmu e-mailových specialistů, databázových analytiků, onsite marketingu a QA. Přechod z vodopádu na agile (Lean, Six Sigma, Kanban, Scrumban, Scrum). E-mailing ve velkém pro statisíce až miliony příjemců.","Led a team of email specialists, database analysts, onsite marketing operations and QA. Led the transition from waterfall to agile (Lean, Six Sigma, Kanban, Scrumban, Scrum). Large-scale emailing to hundreds of thousands to millions of recipients.","Leitung eines Teams aus E-Mail-Spezialisten, Datenbankanalysten, Onsite-Marketing und QA. Übergang von Wasserfall zu Agile (Lean, Six Sigma, Kanban, Scrumban, Scrum). E-Mail-Versand an Hunderttausende bis Millionen Empfänger."]},
 {id:"Z13",brand:"Feedo",brands:["Feedo"],roles:["cmo"],svc:[],ind:["ecom"],env:"startup",s:2014,e:2014,

  sum:["CMO první online drogerie v ČR se zaměřením na potřeby pro maminky s dětmi 0–3 let (CZ, SK, PL).","CMO of the first online drugstore in the Czech Republic, focused on products for mothers with children aged 0–3 (CZ, SK, PL).","CMO der ersten Online-Drogerie in Tschechien mit Fokus auf Produkte für Mütter mit Kindern von 0–3 Jahren (CZ, SK, PL)."],
  det:["Redesign procesů, kampaní, webu a košíku přinesl rekordní tržby a nové zákazníky; CRO (struktura URL, SEO, remarketing, nové platební metody). ROI napříč prodeji 3×, Facebook jako prodejní kanál s ROI 4–8× a jednorázový rekord růstu 20 % meziměsíčně.","A redesign of processes, campaigns, web and checkout brought record revenues and new customers; CRO (URL structure, SEO, remarketing, new payment methods). ROI tripled across sales, Facebook as a sales channel at 4–8× ROI, and a one-off record of 20 % month-over-month growth.","Ein Redesign von Prozessen, Kampagnen, Website und Checkout brachte Rekordumsätze und Neukunden; CRO (URL-Struktur, SEO, Remarketing, neue Zahlungsarten). ROI über alle Verkäufe verdreifacht, Facebook als Vertriebskanal mit 4–8× ROI und ein einmaliger Rekord von 20 % Wachstum zum Vormonat."]},

/* ===== Deep links (D1–D4, 2026-10-29) =====
   Format: #<section>?svc=..&role=..&ind=..&env=..&brand=..&view=timeline&open=Z10&lang=en&ref=client
   Keys are language-neutral and frozen. Removed/renamed keys live in ALIASES forever (tombstones, never reused).
   Old links are translated silently (D4 = A) and the address bar is rewritten to the current form. */
const ALIASES={
 params:{service:"svc",industry:"ind",environment:"env"},
 svc:{},role:{},env:{},brand:{},
 ind:{it:"web",intranet:"web"},                 // 2026-10-28: IT and Intranet merged into Web

function setHash(h){CURHASH=h;if(location.hash===h)return;if(!h.includes("~")){try{history.replaceState(null,"",location.pathname+location.search+h)}catch(e){}return}
 IGNH=h;try{location.replace(h)}catch(e){try{history.replaceState(null,"",location.pathname+location.search+h)}catch(e2){}}}

const LPARAMS=["svc","role","ind","env","brand","view","open","lang","ref"];
const bslug=n=>n.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const gKeys=g=>g.k==="brand"?vals(g).map(bslug):vals(g);
const brandBySlug=sl=>vals(GROUPS.find(g=>g.k==="brand")).find(n=>bslug(n)===sl);
function parseLink(raw){const notes=[];let [h,q]=raw.split("?");q=q||"";if(!q&&h.includes("~")){const ps=h.split("~");h=ps.shift();q=ps.filter(Boolean).map(x=>{const i=x.indexOf(".");return i<0?x+"=":x.slice(0,i)+"="+x.slice(i+1).replace(/_/g,",")}).join("&")}h=h||"home";
 let m;
 if((m=h.match(/^exps-(\w+)$/))){notes.push(["alias",`#${h} → #experience?svc=${m[1]}`]);q=`svc=${m[1]}`+(q?"&"+q:"");h="experience"}
 else if((m=h.match(/^exp-(Z\d+)$/))){notes.push(["alias",`#${h} → #experience?open=${m[1]}`]);q=`open=${m[1]}`+(q?"&"+q:"");h="experience"}
 if(Object.prototype.hasOwnProperty.call(ALIASES.pages,h)){notes.push(["alias",ta("nPage",h,ALIASES.pages[h])]);h=ALIASES.pages[h]}
 const known=["home",...SECS,"privacy","links",...Object.keys(PAGES),...Object.keys(SV).map(k=>"svc-"+k)];
 if(!known.includes(h)){notes.push(["drop",ta("nUnkPage",h)]);h="home"}
 const out={page:h,sel:{svc:[],role:[],ind:[],env:[],brand:[]},view:"cards",open:[],lang:"",ref:"",notes,hasQuery:!!q};
 new URLSearchParams(q).forEach((v,k0)=>{const k=ALIASES.params[k0]||k0;if(k!==k0)notes.push(["alias",ta("nParam",k0,k)]);
  if(!LPARAMS.includes(k)){notes.push(["drop",ta("nUnkParam",k0)]);return}
  if(k==="ref"){out.ref=bslug(v).slice(0,40);return}
  if(k==="lang"){if(LANGS.includes(v))out.lang=v;else notes.push(["drop",ta("nLang",v)]);return}
  if(k==="view"){if(v==="timeline"||v==="cards")out.view=v;else notes.push(["drop",ta("nView",v)]);return}
  v.split(",").filter(Boolean).forEach(x=>{let y=x;
   if(Object.prototype.hasOwnProperty.call(ALIASES[k]||{},x)){y=ALIASES[k][x];notes.push([y===null?"drop":"alias",`${k}=${x} → ${y===null?ta("nRemoved"):y}`]);if(y===null)return}
   if(k==="open"){if(D.some(d=>d.id===y))out.open.push(y);else notes.push(["drop",ta("nEng",y)]);return}
   const g=GROUPS.find(g=>g.k===k);if(gKeys(g).includes(y)){if(!out.sel[k].includes(y))out.sel[k].push(y)}else notes.push(["drop",ta("nGone",k+"="+y)])})});
 return out}

 else if(PAGES[pg])sub=pageCase(pg);
 else if(pg==="privacy")sub=pagePrivacy();

 $("#pg-home").hidden=!!sub;$("#pg-sub").hidden=!sub;
 if(sub){$("#subWrap").innerHTML=sub;if(pg==="links")wireLinks();window.scrollTo(0,0);setActive(pg.startsWith("svc-")?"services":pg.startsWith("case-")?"cases":"");
  const nh=buildHash(pg,{sel:{svc:[],role:[],ind:[],env:[],brand:[]},view:"cards",open:[],lang:st.lang,ref:st.ref});if(CURHASH!==nh)setHash(nh);URLSYNC=true;showCur();return}
 URLSYNC=false;if(L.hasQuery||L.notes.length){applyLink(L);renderExp()}URLSYNC=true;
 const busy=GROUPS.some(g=>st[g.k].size)||st.open.size||st.view!=="cards";
 const sec=SECS.includes(pg)?pg:(L.hasQuery&&busy?"experience":"home");
 const nh=buildHash(sec,stateLink());if(CURHASH!==nh)setHash(nh);

 if(one&&L.hasQuery){one.scrollIntoView({block:"start"});one.classList.add("flash");setTimeout(()=>one.classList.remove("flash"),1600)}
 else if(sec!=="home"){const el=document.getElementById(sec);if(el)el.scrollIntoView()}
 else window.scrollTo(0,0);
 showCur();}

 const c=document.getElementById("contact"),atEnd=window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4;if(atEnd&&c.getBoundingClientRect().top<window.innerHeight/2)cur="contact";setActive(cur)}

/* Czech texts can be overridden from texty-cs.js (window.TX_CS) for local editing */
function applyCS(X){if(!X)return;const set=(arr,v)=>{if(Array.isArray(arr)&&v!==undefined)arr[0]=v};
 Object.assign(T.cs,X.ui||{});Object.assign(LG.cs,X.legal||{});
 Object.entries(X.taxonomy||{}).forEach(([g,o])=>Object.entries(o).forEach(([k,v])=>{if(L[g]&&L[g][k])L[g][k][0]=v}));
 Object.entries(X.services||{}).forEach(([k,o])=>{const sv=SV[k];if(!sv)return;["name","text","who","out"].forEach(f=>set(sv[f],o[f]))});
 Object.entries(X.engagements||{}).forEach(([id,o])=>{const d=D.find(x=>x.id===id);if(!d)return;["role","sum","det","brandL"].forEach(f=>set(d[f],o[f]))});
 Object.entries(X.cases||{}).forEach(([k,o])=>{const p=PAGES[k];if(!p)return;["title","ctx","ch","did","res"].forEach(f=>set(p[f],o[f]));
  (o.kpis||[]).forEach((kv,n)=>{if(p.kpis[n]){p.kpis[n][0]=kv[0];p.kpis[n][1]=kv[1]}})});}
applyCS(window.TX_CS);
/* fine-tune: centre the photo between the cap top of the first headline line and the baseline of the last line */
function centerHero(){const h=document.querySelector(".hero h1"),im=document.querySelector(".hero img");if(!h||!im)return;
 document.documentElement.style.setProperty("--h1shift","0px");
 if(getComputedStyle(h).gridRowStart!=="2"||!h.firstChild)return;
 const r=document.createRange();r.selectNodeContents(h);const rs=[...r.getClientRects()];if(!rs.length)return;
 const fs=parseFloat(getComputedStyle(h).fontSize),first=rs[0],last=rs[rs.length-1];
 const capTop=first.top+(first.height-fs)/2+fs*0.21, base=last.top+(last.height-fs)/2+fs*0.93;
 const ib=im.getBoundingClientRect(),want=(capTop+base)/2-(ib.top+ib.height/2);
 document.documentElement.style.setProperty("--h1shift",Math.round(want)+"px")}
window.addEventListener("resize",centerHero);if(document.fonts)document.fonts.ready.then(centerHero);

 $("#lvsw").innerHTML=LV.map(([k])=>{const n=ta("lv")[+k];return `<button type="button" data-lv="${k}" aria-pressed="${k===v}" title="${n}">V${k} ${n}</button>`}).join("");
 $("#lvsw").querySelectorAll("button").forEach(b=>b.onclick=()=>{setLv(b.dataset.lv);if(!$("#pg-sub").hidden)location.hash="home"})}
setLv(lv);
renderAll();centerHero();
